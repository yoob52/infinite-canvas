server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /workbench/;
    }

    location = /workbench {
        return 301 /workbench/;
    }

    location /workbench/ {
        try_files $uri $uri/ /workbench/index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /workbench/config.js {
        add_header Cache-Control "no-store";
    }
}
